# Rutina de CasosAgentes con Claude (sustituye a la rutina de Grok Bot).
# Lunes, miércoles y viernes prepara casos nuevos en una rama claude-AAAA-MM-DD y abre un PR. Nunca fusiona ni despliega.
# El prompt está en .github/claude/rutina.md y el modelo en .github/claude/settings.json (se cambian sin tocar este archivo).
# Coste: lo paga ANTHROPIC_API_KEY (crédito prepago, máximo 5 €/mes).
name: Casos diarios (Claude)
on:
  schedule:
    - cron: "15 6 * * 1,3,5"   # lunes, miércoles y viernes a las 07:15 en Madrid (invierno)
  workflow_dispatch: {}
permissions:
  contents: write
  pull-requests: write
  id-token: write
concurrency: { group: casos-diarios, cancel-in-progress: false }
jobs:
  lote:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - name: Prompt
        id: p
        run: |
          hoy=$(TZ=Europe/Madrid date +%F)
          { echo "texto<<FIN_PROMPT"; sed "s/{{HOY}}/$hoy/g" .github/claude/rutina.md; echo "FIN_PROMPT"; } >> "$GITHUB_OUTPUT"
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          settings: .github/claude/settings.json
          show_full_output: true
          claude_args: >-
            --max-turns 30
            --allowedTools "Read,Write,Edit,Glob,Grep,WebSearch,WebFetch,Bash(git:*),Bash(gh pr create:*),Bash(gh pr list:*),Bash(node:*),Bash(npm run build),Bash(npx astro build)"
          prompt: ${{ steps.p.outputs.texto }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
